[project]
name = "arbitrary-flasharb"
version = "0.1.0"
description = "Local multi-network flash-loan arbitrage operator"
requires-python = ">=3.12"
dependencies = [
    "web3>=7,<8",
    "pydantic>=2,<3",
    "PyYAML>=6,<7",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "jinja2>=3.1,<4",
    "python-multipart>=0.0.20",
    "itsdangerous>=2.2,<3",
    "httpx[socks]>=0.28,<1",
    "typer>=0.15,<1",
]
[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11", "eth-tester[py-evm]>=0.13.0b1"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/flasharb"]
[project.scripts]
flasharb = "flasharb.cli:app"
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
