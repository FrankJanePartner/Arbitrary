name: Local verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  deterministic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.3'
      - run: uv sync --locked --python 3.12
      - run: npm ci
      - run: npm run contracts:build
      - run: npm run contracts:test
      - run: uv run pytest -q
      - run: uv run ruff check src tests scripts/check-networks.py scripts/run-forks.py
      - run: uv run ruff format --check src tests scripts/check-networks.py scripts/run-forks.py
      - name: Fork scope
        run: echo 'Live protocol fork checks require explicit RPC configuration and are not represented by this job.'
